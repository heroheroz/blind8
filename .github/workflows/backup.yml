name: Weekly backup
on:
  schedule:
    - cron: '0 20 * * 0'   # every Monday 04:00 Hong Kong time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/backup.mjs
      - name: Commit backup if changed
        run: |
          git add backup
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="backup bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Weekly 命例 backup $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && exit 0
            sleep $((i*5))
          done
          exit 1
